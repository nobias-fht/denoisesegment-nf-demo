repository_type: pipeline

nf_core_version: 4.2.1

lint:
  files_unchanged:
    - assets/sendmail_template.txt
    - CODE_OF_CONDUCT.md
    - assets/nf-core-denoisesegment_logo_light.png
    - docs/images/nf-core-denoisesegment_logo_light.png
    - docs/images/nf-core-denoisesegment_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
    - .prettierignore
  nextflow_config:
    - manifest.name
    - manifest.homePage
  multiqc_config: false
  files_exist:
    - assets/multiqc_config.yml
    - CODE_OF_CONDUCT.md
    - assets/nf-core-denoisesegment_logo_light.png
    - docs/images/nf-core-denoisesegment_logo_light.png
    - docs/images/nf-core-denoisesegment_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
    - assets/email_template.html
    - assets/sendmail_template.txt
    - assets/email_template.txt

template:
  org: nobias-fht
  name: denoisesegment
  description: An image-analysis pipeline for Noise2Void denoising with CAREamics and instance segmentation with Cellpose.
  author: Melisande Croft
  version: 1.0.0
  force: true
  outdir: .
  skip_features:
    - multiqc
    - fastqc
    - email
  is_nfcore: false
